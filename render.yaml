services:
  - type: web
    name: whatsapp-screenshot-bot
    runtime: docker
    plan: free
    envVars:
      - key: NODE_OPTIONS
        value: --max-old-space-size=128
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: whatsapp_bot
      - key: PUBLIC_BASE_URL
        sync: false
      - key: LOOKER_ACTION_TOKEN
        generateValue: true
      - key: LOOKER_ALLOWED_CHAT_IDS
        sync: false
      - key: STUDIO_ROUTING_EMAIL
        sync: false
      - key: STUDIO_ROUTE_PEPPER
        generateValue: true
      - key: STUDIO_INGEST_TOKEN
        generateValue: true
      - key: STUDIO_ALLOWED_SENDERS
        sync: false
      - key: STUDIO_ROUTE_ADMIN_IDS
        sync: false
      - key: STUDIO_MAX_PDF_BYTES
        value: "15728640"
      - key: STUDIO_MAX_PAGES
        value: "5"
