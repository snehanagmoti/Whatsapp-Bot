services:
  - type: web
    name: whatsapp-screenshot-bot
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /tmp/whatsapp-bot
      - key: NODE_OPTIONS
        value: --max-old-space-size=128
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: whatsapp_bot
      - key: PUBLIC_BASE_URL
        sync: false
      - key: LOOKER_ACTION_TOKEN
        generateValue: true
      - key: LOOKER_ALLOWED_CHAT_IDS
        sync: false
      - key: ENABLE_COOKIE_AUTH_PORTAL
        value: "false"
